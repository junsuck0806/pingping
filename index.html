<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>군포 맛집</title>
<meta name="description" content="경기도 군포시 맛집 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>군포에서<br>오늘 뭐 먹지?</h1>
    <p>산본, 금정, 군포 동네 맛집을 한곳에 모았어요.</p>
    <div class="row">
      <input id="search" type="search" placeholder="식당 이름, 메뉴, 동네로 검색" aria-label="맛집 검색">
      <button id="random" type="button">오늘의 메뉴 골라줘</button>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="filters" id="categories"></div>
  <div class="filters" id="areas"></div>
  <p id="count"></p>
  <section id="list"></section>
</main>
<footer class="wrap">가격과 영업시간은 바뀔 수 있으니 방문 전에 확인하세요.</footer>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
